name: ci
on:
  push:
  pull_request:

jobs:
  data-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "pydantic>=2.7,<3" fastapi uvicorn pytest httpx
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Tests
        run: PYTHONPATH="packages/core:apps/api" python -m pytest packages/core/tests apps/api/tests -q
      - name: Wordmark spelling
        run: python scripts/check_brand.py
      - name: Prohibited-feature grep
        run: |
          ! grep -riE "openai|anthropic|embedding|vector|stripe|langchain" apps packages data --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=out --exclude-dir=.sitedata --include="*.py" --include="*.ts" --include="*.tsx" --include="*.json"

  site:
    runs-on: ubuntu-latest
    needs: data-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "pydantic>=2.7,<3" fastapi uvicorn httpx
      - name: Export site data and dataset release
        run: |
          PYTHONPATH="packages/core:apps/api" python scripts/export_site.py
          PYTHONPATH="packages/core" python scripts/export_downloads.py
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - name: Broken-link check
        run: python scripts/check_links.py
      - name: Verify release checksums
        run: cd apps/web/out/data && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: site, path: apps/web/out, retention-days: 7 }
