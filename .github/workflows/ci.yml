name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "pydantic>=2.7,<3" fastapi uvicorn pytest httpx
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Tests
        run: PYTHONPATH="packages/core:apps/api" python -m pytest packages/core/tests apps/api/tests -q
      - name: Prohibited-feature grep
        run: |
          ! grep -riE "openai|anthropic|embedding|vector|stripe|langchain" apps packages data --exclude-dir=node_modules --exclude-dir=.next --include="*.py" --include="*.ts" --include="*.tsx" --include="*.json"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "pydantic>=2.7,<3" fastapi uvicorn httpx
      - run: python scripts/export_site.py
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
