[project]
name = "suffeffix-core"
version = "0.1.0"
description = "Suffeffix core: schemas, loaders, validators, graph index, explanation engine. Pure library, zero web-framework imports."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suffeffix_core"]
