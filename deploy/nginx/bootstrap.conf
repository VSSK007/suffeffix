# Step 1 of 2 — plain HTTP only, used once to obtain the TLS certificate.
# setup-server.sh installs this, runs certbot, then replaces it with suffeffix.conf.
server {
    listen 80;
    listen [::]:80;
    server_name suffeffix.com www.suffeffix.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /var/www/suffeffix/current;
        try_files $uri $uri/ =404;
    }
}
