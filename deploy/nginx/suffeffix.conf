# suffeffix.com — static site served from /var/www/suffeffix/current (a symlink to the
# newest release; see deploy/deploy.sh). Install as /etc/nginx/sites-available/suffeffix.conf.
#
# Canonical host is https://suffeffix.com (canonical URLs, sitemap and Open Graph tags assume it):
#   http://*           -> https://suffeffix.com
#   https://www.*      -> https://suffeffix.com

# ── HTTP: ACME challenges, then redirect everything to the canonical HTTPS host ──
server {
    listen 80;
    listen [::]:80;
    server_name suffeffix.com www.suffeffix.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://suffeffix.com$request_uri;
    }
}

# ── HTTPS: www -> apex ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.suffeffix.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/suffeffix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suffeffix.com/privkey.pem;

    return 301 https://suffeffix.com$request_uri;
}

# ── HTTPS: the site ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suffeffix.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/suffeffix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suffeffix.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/suffeffix/current;
    index index.html;
    charset utf-8;

    # compression (HTML is always eligible)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    include /etc/nginx/snippets/suffeffix-security-headers.conf;

    error_page 404 /404.html;

    # Directories carry a trailing slash (/lexicon/); nginx adds it with a 301 if it is missing.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/suffeffix-security-headers.conf;
    }

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/suffeffix-security-headers.conf;
        try_files $uri =404;
    }

    # Dataset downloads: open to any origin (it is a public dataset), cached for an hour.
    location /data/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/suffeffix-security-headers.conf;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/suffeffix-security-headers.conf;
    }

    location = /og.png {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/suffeffix-security-headers.conf;
    }

    location = /search-index.json {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/suffeffix-security-headers.conf;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
